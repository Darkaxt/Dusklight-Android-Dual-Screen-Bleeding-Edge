pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "dusklight-android"
include ':app'

def externalBuildRoot = System.getenv('DUSK_ANDROID_BUILD_ROOT')
if (externalBuildRoot) {
    gradle.beforeProject { project ->
        def relativeProject = project.path == ':'
            ? 'root'
            : project.path.substring(1).replace(':', File.separator)
        project.layout.buildDirectory.set(new File(externalBuildRoot, relativeProject))
    }
}
