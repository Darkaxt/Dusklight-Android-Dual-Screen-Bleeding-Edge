plugins {
    id 'com.android.application'
}

def duskRepoDir = rootProject.projectDir.parentFile.parentFile
def versionProperties = new Properties()
def versionFile = rootProject.file('version.properties')
if (!versionFile.isFile()) {
    throw new GradleException("Missing Android version manifest: ${versionFile}")
}
versionFile.withInputStream { versionProperties.load(it) }
def upstreamVersion = versionProperties.getProperty('upstreamVersion')
def portRevisionText = versionProperties.getProperty('portRevision')
def versionNameStr = versionProperties.getProperty('versionName')
def versionCodeText = versionProperties.getProperty('versionCode')
def releaseTag = versionProperties.getProperty('releaseTag')
if (!(upstreamVersion ==~ /\d+\.\d+\.\d+/) || !(portRevisionText ==~ /\d+/) ||
    !(versionNameStr ==~ /\d+\.\d+\.\d+\.\d+/) || !(versionCodeText ==~ /\d+/) ||
    releaseTag != versionNameStr) {
    throw new GradleException('version.properties contains an invalid or inconsistent release identity')
}
def upstreamParts = upstreamVersion.tokenize('.')*.toInteger()
def portRevision = portRevisionText.toInteger()
def versionCodeInt = versionCodeText.toInteger()
def expectedVersionName = "${upstreamVersion}.${portRevision}"
def expectedVersionCode = upstreamParts[0] * 100000000 + upstreamParts[1] * 1000000 +
    upstreamParts[2] * 1000 + portRevision
if (versionNameStr != expectedVersionName || versionCodeInt != expectedVersionCode) {
    throw new GradleException(
        "version.properties must encode ${expectedVersionName}/${expectedVersionCode}")
}
def requestedVersion = System.getenv('DUSK_VERSION')
def requestedVersionCode = System.getenv('DUSK_VERSION_CODE')
def requestedTag = System.getenv('GIT_TAG')
if ((requestedVersion && requestedVersion.replaceFirst('^v', '') != versionNameStr) ||
    (requestedVersionCode && requestedVersionCode != versionCodeText) ||
    (requestedTag && requestedTag.replaceFirst('^v', '') != releaseTag)) {
    throw new GradleException('Environment release identity does not match version.properties')
}
def releaseAbis = (System.getenv('DUSK_ANDROID_RELEASE_ABIS') ?: 'arm64-v8a')
    .split(',')*.trim().findAll { !it.isEmpty() }
def supportedAbis = ['arm64-v8a', 'x86_64'] as Set
if (releaseAbis.isEmpty() || releaseAbis.toSet().size() != releaseAbis.size() ||
    !supportedAbis.containsAll(releaseAbis)) {
    throw new GradleException("Unsupported or duplicate release ABI contract: ${releaseAbis}")
}
def externalJniLibs = System.getenv('DUSK_ANDROID_JNI_LIBS_DIR')
def duskGeneratedAssetsDir = layout.buildDirectory.dir('generated/assets/dusklight').get().asFile
def syncDuskAssets = tasks.register('syncDuskAssets', Sync) {
    from(new File(duskRepoDir, 'res')) {
        into 'res'
        exclude '**/.DS_Store'
    }
    into duskGeneratedAssetsDir
}

android {
    namespace 'dev.twilitrealm.dusk'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.twilitrealm.dusk'
        minSdk 26
        targetSdk 36
        versionCode versionCodeInt
        versionName versionNameStr
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = [externalJniLibs ? file(externalJniLibs) : file('src/main/jniLibs')]
            assets.srcDirs = [duskGeneratedAssetsDir]
        }
    }

    splits {
        abi {
            enable true
            reset()
            include(*releaseAbis)
            universalApk false
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}

tasks.configureEach { task ->
    if ((task.name.startsWith('merge') && task.name.endsWith('Assets')) ||
        task.name.toLowerCase().contains('lint')) {
        task.dependsOn(syncDuskAssets)
    }
}
